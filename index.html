<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CulturaHub — Portal de Editais Culturais</title>
<meta name="description" content="Editais e chamadas públicas culturais do Paraná, São Paulo, Santa Catarina e nacionais, organizados por categoria." />

<!-- Tailwind CSS (JIT, runs in-browser — no build step needed for GitHub Pages) -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- React 18 + Babel standalone (transforms the JSX below, in-browser) -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
  @keyframes fade-in {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .animate-fade-in { animation: fade-in 0.25s ease-out; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">

const { useState, useEffect } = React;

const CATEGORIES = ['Todos', 'Música', 'Cinema', 'Teatro', 'Literatura', 'Artes Visuais'];
const UFS = ['Todos', 'PR', 'SP', 'SC', 'Nacional'];

function Icon({ children, size = 16, className = '' }) {
  return (
    <svg
      width={size}
      height={size}
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      strokeWidth="2"
      strokeLinecap="round"
      strokeLinejoin="round"
      className={className}
      aria-hidden="true"
    >
      {children}
    </svg>
  );
}

const Sparkles = (p) => <Icon {...p}><path d="M12 3l1.8 4.9L18.5 9l-4.7 1.6L12 15.5l-1.8-4.9L5.5 9l4.7-1.6L12 3z"/><path d="M19 15l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/></Icon>;
const Send = (p) => <Icon {...p}><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></Icon>;
const RefreshCw = (p) => <Icon {...p}><path d="M21 12a9 9 0 1 1-3-6.7"/><polyline points="21 3 21 9 15 9"/></Icon>;
const Music = (p) => <Icon {...p}><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></Icon>;
const Film = (p) => <Icon {...p}><rect x="2" y="3" width="20" height="18" rx="2"/><line x1="7" y1="3" x2="7" y2="21"/><line x1="17" y1="3" x2="17" y2="21"/><line x1="2" y1="9" x2="7" y2="9"/><line x1="2" y1="15" x2="7" y2="15"/><line x1="17" y1="9" x2="22" y2="9"/><line x1="17" y1="15" x2="22" y2="15"/></Icon>;
const Ticket = (p) => <Icon {...p}><path d="M3 9a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v1.5a2 2 0 0 0 0 3V15a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1.5a2 2 0 0 0 0-3V9z"/></Icon>;
const BookMarked = (p) => <Icon {...p}><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/><polyline points="10 2 10 10 13 7.5 16 10 16 2"/></Icon>;
const Palette = (p) => <Icon {...p}><path d="M12 2a10 10 0 1 0 9.5 13c.3-.9-.4-1.8-1.4-1.8h-3a2.3 2.3 0 0 1-2.3-2.3c0-.6.2-1.1.6-1.6.4-.4.6-1 .6-1.6A2.3 2.3 0 0 0 13.7 5.4 9.9 9.9 0 0 0 12 2z"/><circle cx="7.5" cy="10.5" r="1"/><circle cx="8.5" cy="15.5" r="1"/><circle cx="13" cy="17.5" r="1"/></Icon>;
const Award = (p) => <Icon {...p}><circle cx="12" cy="8" r="6"/><path d="M8.2 13.9L7 23l5-3 5 3-1.2-9.1"/></Icon>;
const ExternalLink = (p) => <Icon {...p}><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></Icon>;
const CheckCircle2 = (p) => <Icon {...p}><path d="M22 11.1V12a10 10 0 1 1-5.9-9.1"/><polyline points="22 4 12 14 9 11"/></Icon>;

const FALLBACK_EDITAIS = [
  {
    id: 1,
    title: 'Edital de Fomento – Multiartes 2026',
    category: 'Artes Visuais',
    value: 'Variável',
    deadline: 'Contínuo',
    description: 'Edital da Secretaria de Cultura do Paraná, visando projetos de fomento nas áreas de multiartes no estado.',
    sponsor: 'Secretaria da Cultura - PR',
    url: 'https://www.cultura.pr.gov.br/',
    uf: 'PR',
    municipio: 'Curitiba'
  },
  {
    id: 2,
    title: 'Prêmio Spcine de Desenvolvimento de Jogos',
    category: 'Cinema',
    value: 'R$ 150.000',
    deadline: '30/09/2026',
    description: 'Apoio financeiro para o desenvolvimento de protótipos de jogos eletrônicos independentes em São Paulo.',
    sponsor: 'Spcine / Prefeitura de SP',
    url: 'https://www.spcine.com.br/',
    uf: 'SP',
    municipio: 'São Paulo'
  }
];

function Toast({ message, onClose }) {
  return (
    <div role="status" className="fixed bottom-6 right-6 z-50 flex items-center gap-3 bg-[#111827] border border-cyan-500/30 px-5 py-4 rounded-xl shadow-[0_0_30px_rgba(34,211,238,0.2)] text-white animate-fade-in max-w-sm">
      <CheckCircle2 className="text-cyan-400 shrink-0" size={20} />
      <p className="text-sm font-medium">{message}</p>
      <button
        onClick={onClose}
        className="ml-auto text-slate-400 hover:text-white text-xs font-bold px-2 py-1 bg-white/5 rounded focus:outline-none focus-visible:ring-2 focus-visible:ring-cyan-400"
      >
        OK
      </button>
    </div>
  );
}

function App() {
  const [editais, setEditais] = useState([]);
  const [loading, setLoading] = useState(true);
  const [loadError, setLoadError] = useState(false);
  const [activeCategory, setActiveCategory] = useState('Todos');
  const [selectedUf, setSelectedUf] = useState('Todos');
  const [email, setEmail] = useState('');
  const [isSubmitting, setIsSubmitting] = useState(false);
  const [notification, setNotification] = useState(null);

  const fetchEditais = async () => {
    setLoading(true);
    setLoadError(false);
    try {
      const response = await fetch('./editais.json', { cache: 'no-store' });
      if (!response.ok) throw new Error('Falha ao carregar dados');
      const data = await response.json();
      setEditais(Array.isArray(data) && data.length ? data : FALLBACK_EDITAIS);
    } catch (err) {
      console.warn('Não foi possível carregar editais.json, usando dados de exemplo.', err);
      setEditais(FALLBACK_EDITAIS);
      setLoadError(true);
    } finally {
      setLoading(false);
    }
  };

  useEffect(() => {
    fetchEditais();
  }, []);

  const handleNewsletterSubmit = (e) => {
    e.preventDefault();
    if (!email) return;
    setIsSubmitting(true);
    setTimeout(() => {
      setIsSubmitting(false);
      setEmail('');
      setNotification('E-mail cadastrado! (Demonstração — conecte um serviço de e-mail para ativar de verdade.)');
    }, 1200);
  };

  const filteredEditais = editais.filter((edital) => {
    const matchesCategory = activeCategory === 'Todos' || edital.category === activeCategory;
    const matchesUf = selectedUf === 'Todos' || edital.uf === selectedUf;
    return matchesCategory && matchesUf;
  });

  const getCategoryIcon = (category) => {
    switch (category) {
      case 'Música': return <Music size={16} />;
      case 'Cinema': return <Film size={16} />;
      case 'Teatro': return <Ticket size={16} />;
      case 'Literatura': return <BookMarked size={16} />;
      case 'Artes Visuais': return <Palette size={16} />;
      default: return <Award size={16} />;
    }
  };

  return (
    <div className="min-h-screen bg-[#0a0e17] text-slate-100 font-sans selection:bg-cyan-500 selection:text-black">
      <header className="border-b border-white/10 bg-[#0d1322]/80 backdrop-blur-md sticky top-0 z-40">
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col md:flex-row items-center justify-between gap-4">
          <div className="flex items-center gap-3">
            <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-purple-600 flex items-center justify-center shadow-[0_0_20px_rgba(34,211,238,0.3)]">
              <Sparkles className="text-white" size={20} />
            </div>
            <div>
              <h1 className="text-xl font-black tracking-wider text-white">CULTURAHUB</h1>
              <p className="text-xs text-slate-400">Portal de editais culturais — Paraná, SP, SC e nacionais</p>
            </div>
          </div>

          <form onSubmit={handleNewsletterSubmit} className="flex items-center gap-2 w-full md:w-auto">
            <label htmlFor="newsletter-email" className="sr-only">Seu e-mail para alertas de novos editais</label>
            <input
              id="newsletter-email"
              type="email"
              required
              placeholder="Seu e-mail para alertas..."
              value={email}
              onChange={(e) => setEmail(e.target.value)}
              className="bg-[#151b2b] border border-white/10 rounded-xl px-4 py-2 text-sm text-white placeholder-slate-500 focus:outline-none focus-visible:ring-2 focus-visible:ring-cyan-400 focus:border-cyan-400 transition-colors w-full md:w-64"
            />
            <button
              type="submit"
              disabled={isSubmitting}
              className="bg-cyan-500 hover:bg-cyan-400 text-black font-semibold px-4 py-2 rounded-xl text-sm flex items-center gap-2 transition-colors disabled:opacity-50 shrink-0 focus:outline-none focus-visible:ring-2 focus-visible:ring-cyan-300"
            >
              {isSubmitting ? 'Salvando...' : <>Assinar <Send size={14} /></>}
            </button>
          </form>
        </div>
      </header>

      <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
        <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
          <div>
            <h2 className="text-3xl font-black text-white mb-2">Editais Disponíveis</h2>
            <p className="text-slate-400">
              {loadError
                ? 'Exibindo dados de exemplo — editais.json não encontrado ou vazio.'
                : 'Lista de editais e chamadas públicas abertas nas áreas culturais.'}
            </p>
          </div>
          <button
            onClick={fetchEditais}
            className="flex items-center gap-2 px-4 py-2 bg-white/5 border border-white/10 hover:bg-white/10 rounded-xl text-sm transition-all focus:outline-none focus-visible:ring-2 focus-visible:ring-cyan-400"
          >
            <RefreshCw size={14} className={loading ? 'animate-spin text-cyan-400' : ''} />
            Atualizar dados
          </button>
        </div>

        <div className="flex flex-wrap gap-3 mb-6" role="group" aria-label="Filtrar por categoria">
          {CATEGORIES.map((category) => (
            <button
              key={category}
              onClick={() => setActiveCategory(category)}
              aria-pressed={activeCategory === category}
              className={`flex items-center gap-2 px-5 py-2 rounded-full border transition-all duration-300 focus:outline-none focus-visible:ring-2 focus-visible:ring-cyan-400 ${
                activeCategory === category
                  ? 'bg-cyan-500/10 border-cyan-400/50 text-cyan-300 shadow-[0_0_15px_rgba(34,211,238,0.15)]'
                  : 'bg-[#151b2b] border-white/5 text-slate-400 hover:bg-white/5 hover:text-slate-200'
              }`}
            >
              {category !== 'Todos' && getCategoryIcon(category)}
              {category}
            </button>
          ))}
        </div>

        <div className="flex items-center gap-3 mb-10 overflow-x-auto pb-2" role="group" aria-label="Filtrar por UF">
          <span className="text-sm font-medium text-slate-400 shrink-0">Filtrar por UF:</span>
          {UFS.map((uf) => (
            <button
              key={uf}
              onClick={() => setSelectedUf(uf)}
              aria-pressed={selectedUf === uf}
              className={`px-3 py-1.5 rounded-lg text-sm border transition-all focus:outline-none focus-visible:ring-2 focus-visible:ring-purple-400 ${
                selectedUf === uf
                  ? 'bg-purple-600/20 border-purple-400 text-purple-300'
                  : 'bg-[#151b2b] border-white/5 text-slate-400 hover:text-white'
              }`}
            >
              {uf}
            </button>
          ))}
        </div>

        {loading ? (
          <div className="text-center py-20 text-slate-400 flex flex-col items-center justify-center gap-3">
            <RefreshCw className="animate-spin text-cyan-400" size={32} />
            Carregando editais...
          </div>
        ) : filteredEditais.length === 0 ? (
          <div className="text-center py-20 text-slate-500 flex flex-col items-center gap-3">
            <Award size={32} className="text-slate-600" />
            <p>Nenhum edital encontrado para os filtros selecionados.</p>
            <button
              onClick={() => { setActiveCategory('Todos'); setSelectedUf('Todos'); }}
              className="text-cyan-400 hover:text-cyan-300 text-sm underline underline-offset-4 focus:outline-none focus-visible:ring-2 focus-visible:ring-cyan-400 rounded"
            >
              Limpar filtros
            </button>
          </div>
        ) : (
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            {filteredEditais.map((edital) => (
              <div
                key={edital.id}
                className="group relative bg-[#131a2a] border border-white/10 rounded-2xl p-6 hover:border-cyan-500/30 hover:shadow-[0_0_30px_rgba(34,211,238,0.05)] transition-all duration-300 flex flex-col"
              >
                <div className="flex justify-between items-start mb-4 gap-2">
                  <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-md bg-white/5 text-xs font-medium text-slate-300 border border-white/5">
                    {getCategoryIcon(edital.category)}
                    {edital.category}
                  </span>
                  <span className="px-2.5 py-1 rounded-md bg-purple-500/10 text-purple-300 text-xs font-bold border border-purple-500/20">
                    {edital.municipio} - {edital.uf}
                  </span>
                </div>

                <h3 className="text-xl font-bold text-white mb-2 group-hover:text-cyan-300 transition-colors">
                  {edital.title}
                </h3>
                <p className="text-sm text-slate-400 mb-6 flex-grow line-clamp-3">
                  {edital.description}
                </p>

                <div className="bg-black/20 rounded-xl p-4 mb-6 border border-white/5">
                  <div className="flex justify-between text-sm mb-2">
                    <span className="text-slate-500">Patrocinador</span>
                    <span className="text-slate-200 font-medium text-right">{edital.sponsor}</span>
                  </div>
                  <div className="flex justify-between text-sm mb-2">
                    <span className="text-slate-500">Valor</span>
                    <span className="text-emerald-400 font-medium">{edital.value}</span>
                  </div>
                  <div className="flex justify-between text-sm">
                    <span className="text-slate-500">Prazo</span>
                    <span className="text-slate-200 font-medium">{edital.deadline}</span>
                  </div>
                </div>

                <a
                  href={edital.url || '#'}
                  target="_blank"
                  rel="noopener noreferrer"
                  className="w-full py-3.5 rounded-xl font-semibold flex justify-center items-center gap-2 transition-all duration-300 bg-white/5 text-white hover:bg-white/10 border border-white/10 hover:border-white/20 hover:text-cyan-300 focus:outline-none focus-visible:ring-2 focus-visible:ring-cyan-400"
                >
                  Acessar edital completo
                  <ExternalLink size={16} className="opacity-70" />
                </a>
              </div>
            ))}
          </div>
        )}
      </main>

      <footer className="border-t border-white/10 py-8 text-center text-xs text-slate-500">
        CulturaHub — dados de exemplo. Verifique sempre a fonte oficial antes de submeter uma proposta.
      </footer>

      {notification && (
        <Toast message={notification} onClose={() => setNotification(null)} />
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

</script>
</body>
</html>
