name: Atualizar Editais Automaticamente

on:
  schedule:
    - cron: '0 8 * * *' # Roda todo dia às 08:00 UTC
  workflow_dispatch: # Permite rodar manualmente pelo painel do GitHub

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Clonar Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Executar Raspagem de Dados
        run: python scrapers/gerar_editais.py

      - name: Commit e Push automáticos das alterações
        run: |
          git config --global user.name 'Robô de Editais'
          git config --global user.email 'robo@users.noreply.github.com'
          git add editais.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Atualização automática de editais: $(date +'%Y-%m-%d')" && git push)
```
